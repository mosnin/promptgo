name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, SEO audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the tool registry
        run: npm run gen

      - name: Type check
        run: npx tsc --noEmit

      # The SEO contract is the product here, so it is a build gate rather than
      # a lint suggestion. This fails on missing exact match keywords, keyword
      # density outside the target band, thin articles, dead internal links,
      # duplicate titles or descriptions anywhere on the site, and em dashes.
      - name: SEO audit
        run: node scripts/audit-seo.mjs

      - name: Build
        run: npm run build
